{% extends "base.html" %}
{% block content %}
<section class="panel">
    <div class="panel-header panel-header-stack">
        <div>
            <h2><i class="ph ph-sliders-horizontal"></i> 发送配置</h2>
            <p class="panel-description">统一维护登录、邮件和 Webhook 配置。</p>
        </div>
    </div>
    <form method="post" action="{{ url_for('save_settings_route') }}" class="settings-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="settings-section settings-section-card">
            <h3><i class="ph ph-lock-key"></i> 登录配置</h3>
            <div class="form-grid">
                <label>
                    <span><i class="ph ph-user"></i> 登录账号</span>
                    <input type="text" name="auth_username" value="{{ settings.auth.username }}">
                </label>
                <label>
                    <span><i class="ph ph-lock-key-open"></i> 登录密码</span>
                    <div class="password-field">
                        <input id="auth_password" type="password" name="auth_password" value="" placeholder="留空则不修改" autocomplete="new-password">
                        <button id="toggle_auth_password" type="button" class="password-toggle" aria-label="显示密码">
                            <i class="ph ph-eye"></i>
                        </button>
                    </div>
                </label>
                <label>
                    <span><i class="ph ph-notebook"></i> 登录备注</span>
                    <input type="text" name="auth_note" value="{{ settings.auth.note }}">
                </label>
            </div>
        </div>

        <div class="settings-section settings-section-card">
            <h3><i class="ph ph-envelope-simple"></i> 邮件配置</h3>
            <div class="form-grid">
                <label>
                    <span><i class="ph ph-globe"></i> SMTP 服务器</span>
                    <input type="text" name="smtp_server" value="{{ settings.smtp.server }}" placeholder="smtp.example.com">
                </label>
                <label>
                    <span><i class="ph ph-plugs-connected"></i> SMTP 端口</span>
                    <input type="number" name="smtp_port" value="{{ settings.smtp.port }}">
                </label>
                <label>
                    <span><i class="ph ph-user"></i> SMTP 账号</span>
                    <input type="text" name="smtp_user" value="{{ settings.smtp.user }}">
                </label>
                <label>
                    <span><i class="ph ph-lock-key"></i> SMTP 密码/授权码</span>
                    <div class="password-field">
                        <input id="smtp_password" type="password" name="smtp_password" value="{{ settings.smtp.password }}">
                        <button id="toggle_password" type="button" class="password-toggle" aria-label="显示密码">
                            <i class="ph ph-eye"></i>
                        </button>
                    </div>
                </label>
                <label>
                    <span><i class="ph ph-paper-plane-right"></i> 发件邮箱</span>
                    <input type="text" name="smtp_sender" value="{{ settings.smtp.sender }}" placeholder="noreply@example.com">
                </label>
                <label>
                    <span><i class="ph ph-inbox"></i> 收件邮箱</span>
                    <input type="text" name="smtp_receiver" value="{{ settings.smtp.receiver }}" placeholder="ops@example.com">
                </label>
                <label>
                    <span><i class="ph ph-note-pencil"></i> 备注</span>
                    <input type="text" name="smtp_note" value="{{ settings.smtp.note }}">
                </label>
            </div>
        </div>

        <div class="settings-section settings-section-card">
            <h3><i class="ph ph-webhooks-logo"></i> Webhook 配置</h3>
            <div id="webhook-target-list" class="webhook-target-list"></div>
            <div class="actions-inline webhook-target-actions">
                <button type="button" class="btn-link" id="addWebhookTarget">
                    <i class="ph ph-plus"></i> 添加通道
                </button>
            </div>
            <input type="hidden" name="webhook_targets_json" id="webhook_targets_json">
        </div>

        <div class="actions-inline settings-save-actions">
            <button type="submit" class="primary">
                <i class="ph ph-floppy-disk"></i> 保存设置
            </button>
        </div>
    </form>
</section>

<section class="panel settings-test-panel">
    <div class="panel-header panel-header-stack">
        <div>
            <h2><i class="ph ph-plugs-connected"></i> 连通性测试</h2>
            <p class="panel-description">保存后可发送测试请求确认连通性。</p>
        </div>
    </div>
    <div class="test-actions settings-test-actions">
        <form method="post" action="{{ url_for('test_email_route') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="btn-link btn-secondary-action">
                <i class="ph ph-paper-plane-right"></i> 发送邮件测试
            </button>
        </form>
        <form method="post" action="{{ url_for('test_webhook_route') }}" class="webhook-test-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <select name="webhook_target_id" aria-label="选择测试通道">
                {% for target in settings.webhook.targets %}
                <option value="{{ target.id }}">{{ target.name }}</option>
                {% else %}
                <option value="">未配置通道</option>
                {% endfor %}
            </select>
            <button type="submit" class="btn-link btn-secondary-action">
                <i class="ph ph-webhooks-logo"></i> 发送 Webhook 测试
            </button>
        </form>
    </div>
</section>

<script>
    window.WEBHOOK_TARGETS = {{ settings.webhook.targets | tojson }};
</script>
{% raw %}
<script>
(function () {
    function bindToggle(buttonId, inputId) {
        var toggleButton = document.getElementById(buttonId);
        var passwordInput = document.getElementById(inputId);
        if (!toggleButton || !passwordInput) {
            return;
        }

        toggleButton.addEventListener("click", function () {
            var showing = passwordInput.type === "text";
            passwordInput.type = showing ? "password" : "text";
            toggleButton.innerHTML = showing ? '<i class="ph ph-eye"></i>' : '<i class="ph ph-eye-slash"></i>';
            toggleButton.setAttribute("aria-label", showing ? "显示密码" : "隐藏密码");
        });
    }

    bindToggle("toggle_password", "smtp_password");
    bindToggle("toggle_auth_password", "auth_password");
})();

// ---------- Webhook 通道管理 ----------
(function () {
    var methodHints = {
        get: "每项为「参数名=值」，占位符值自动 URL 编码；地址中也可直接使用占位符（路径风格）",
        post_json: "JSON 请求体模板：占位符值按 JSON 字符串转义，渲染后必须为合法 JSON；token 等固定字段直接写在模板里",
        post_form: "每项为「参数名=值」，占位符值自动 URL 编码"
    };
    var methodTemplateLabels = {
        get: "查询参数模板",
        post_json: "JSON 请求体模板",
        post_form: "表单参数模板"
    };
    var methodPlaceholders = {
        get: "title={{title}}&content={{content}}",
        post_json: '{"title": "{{title}}", "msg": "{{content}}", "token": "固定 token", "issecure": "0"}',
        post_form: "title={{title}}&content={{content}}"
    };
    var placeholderLegend = "可用占位符：{{title}} 任务标题 · {{content}} 任务内容 · {{url}} 相关链接 · {{time}} 发送时间，发送时自动替换为实际值";

    var targetList = document.getElementById("webhook-target-list");
    var addTargetButton = document.getElementById("addWebhookTarget");
    var targetsInput = document.getElementById("webhook_targets_json");
    var settingsForm = targetsInput ? targetsInput.closest("form") : null;
    var savedTargets = Array.isArray(window.WEBHOOK_TARGETS) ? window.WEBHOOK_TARGETS : [];

    function updateMethodHint(row) {
        var methodSelect = row.querySelector(".target-method");
        var method = methodSelect.value;
        row.querySelector(".target-template-label").textContent = methodTemplateLabels[method] || "请求模板";
        row.querySelector(".target-template").placeholder = methodPlaceholders[method] || "";
        row.querySelector(".webhook-method-hint").textContent =
            (methodHints[method] || "") + "。" + placeholderLegend;
    }

    function createTargetRow(target) {
        var row = document.createElement("div");
        row.className = "webhook-target-card";
        row.dataset.targetId = target && target.id ? String(target.id) : "";
        row.innerHTML = [
            '<div class="webhook-target-head">',
            '  <label class="webhook-field webhook-field-grow"><span>通道名称</span>',
            '    <input type="text" class="target-name" placeholder="例如：showdoc推送 / ggsuper"></label>',
            '  <label class="webhook-field webhook-field-method"><span>请求方式</span>',
            '    <select class="target-method">',
            '      <option value="get">GET 查询</option>',
            '      <option value="post_json">POST JSON</option>',
            '      <option value="post_form">POST 表单</option>',
            '    </select></label>',
            '  <button type="button" class="btn-link danger-text target-remove" aria-label="删除通道"><i class="ph ph-trash"></i> 删除</button>',
            '</div>',
            '<label class="webhook-field"><span>Webhook 地址</span>',
            '  <input type="text" class="target-url" placeholder="https://example.com/hook"></label>',
            '<label class="webhook-field"><span class="target-template-label">请求模板</span>',
            '  <textarea class="target-template" rows="3"></textarea></label>',
            '<label class="webhook-field"><span>备注（可选）</span>',
            '  <input type="text" class="target-note" placeholder="选填，方便区分用途"></label>',
            '<div class="webhook-method-hint"></div>'
        ].join("");

        row.querySelector(".target-name").value = (target && target.name) || "";
        row.querySelector(".target-method").value = (target && target.method) || "get";
        row.querySelector(".target-url").value = (target && target.url) || "";
        row.querySelector(".target-template").value = (target && target.template) || "";
        row.querySelector(".target-note").value = (target && target.note) || "";

        row.querySelector(".target-method").addEventListener("change", function () {
            updateMethodHint(row);
        });
        row.querySelector(".target-remove").addEventListener("click", function () {
            row.remove();
        });

        updateMethodHint(row);
        return row;
    }

    function collectTargets() {
        var targets = [];
        targetList.querySelectorAll(".webhook-target-card").forEach(function (row) {
            var target = {
                id: row.dataset.targetId ? parseInt(row.dataset.targetId, 10) : null,
                name: row.querySelector(".target-name").value.trim(),
                method: row.querySelector(".target-method").value,
                url: row.querySelector(".target-url").value.trim(),
                template: row.querySelector(".target-template").value,
                note: row.querySelector(".target-note").value.trim()
            };
            // 整行都为空的新增行不提交，避免误点“添加通道”后无法保存
            if (!target.id && !target.name && !target.url && !target.template && !target.note) {
                return;
            }
            targets.push(target);
        });
        return targets;
    }

    if (targetList && addTargetButton && targetsInput && settingsForm) {
        if (savedTargets.length === 0) {
            targetList.appendChild(createTargetRow(null));
        } else {
            savedTargets.forEach(function (target) {
                targetList.appendChild(createTargetRow(target));
            });
        }
        addTargetButton.addEventListener("click", function () {
            targetList.appendChild(createTargetRow(null));
        });
        settingsForm.addEventListener("submit", function () {
            targetsInput.value = JSON.stringify(collectTargets());
        });
    }
})();
</script>
{% endraw %}
{% endblock %}
