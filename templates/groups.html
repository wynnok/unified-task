{% extends "base.html" %}
{% block content %}
<section class="page-toolbar">
    <div>
        <h2 class="page-title"><i class="ph ph-folders"></i> 分组管理</h2>
        <p class="page-subtitle">共 {{ groups|length }} 个分组，序号决定展示顺序；分组下仍有任务时无法删除。</p>
    </div>
    <div class="page-toolbar-actions">
        <button type="button" class="btn btn-primary" onclick="openGroupModal()">
            <i class="ph ph-plus"></i> 新建分组
        </button>
    </div>
</section>

<section class="panel data-panel">
    <div class="filter-bar">
        <input type="search" id="groupKeyword" placeholder="按名称筛选分组" aria-label="按名称筛选分组" oninput="filterGroups(this.value)">
    </div>

    <div class="table-wrap">
        <table class="data-table" id="groupsTable">
            <thead>
                <tr>
                    <th>分组</th>
                    <th class="hide-sm">序号</th>
                    <th>任务数</th>
                    <th class="actions-cell">操作</th>
                </tr>
            </thead>
            <tbody>
                {% for group in groups %}
                <tr class="data-row" data-group='{{ {
                    "id": group.id,
                    "sort_order": group.sort_order,
                    "name": group.name,
                    "icon": group.icon
                } | tojson }}'>
                    <td>
                        <div class="row-title-cell">
                            <strong class="row-title"><i class="ph ph-{{ group.icon }} row-title-icon"></i>{{ group.name }}</strong>
                        </div>
                    </td>
                    <td class="hide-sm cell-muted">{{ group.sort_order }}</td>
                    <td>
                        <a class="count-link" href="{{ url_for('tasks_page', group_id=group.id) }}">
                            {{ group.task_count }} 个任务
                        </a>
                    </td>
                    <td class="actions-cell">
                        <button type="button" class="row-action" title="编辑分组 {{ group.name }}" aria-label="编辑分组 {{ group.name }}" onclick="openGroupModal(this.closest('tr').dataset.group)">
                            <i class="ph ph-pencil-simple"></i>
                        </button>
                        <form method="post" action="{{ url_for('delete_group_route', group_id=group.id) }}" class="group-delete-form inline-form"
                              data-confirm="确认删除分组「{{ group.name }}」？"
                              data-confirm-title="删除分组"
                              data-confirm-ok="删除">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                            <button type="submit" class="row-action danger" title="删除分组 {{ group.name }}" aria-label="删除分组 {{ group.name }}">
                                <i class="ph ph-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4">
                        <div class="empty-state">
                            <i class="ph ph-tray empty-state-icon"></i>
                            <p>暂无分组</p>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>

<!-- 新建 / 编辑分组模态框 -->
<div class="modal-overlay" id="group-modal" role="dialog" aria-modal="true" aria-labelledby="group-modal-title">
    <div class="modal modal-sm">
        <div class="modal-header">
            <h3 id="group-modal-title">新建分组</h3>
            <button type="button" class="modal-close" aria-label="关闭" onclick="closeGroupModal()"><i class="ph ph-x"></i></button>
        </div>
        <form id="group-modal-form" method="post" action="{{ url_for('create_group_route') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="modal-body field-grid">
                <label>
                    <span><i class="ph ph-text-t"></i> 名称</span>
                    <input type="text" name="name" id="group-name" required placeholder="例如：财务">
                </label>
                <label>
                    <span><i class="ph ph-sort-ascending"></i> 序号</span>
                    <input type="number" name="sort_order" id="group-sort" required value="10">
                </label>
                <label class="field-wide">
                    <span><i class="ph ph-smiley"></i> 图标</span>
                    <select name="icon" id="group-icon" required>
                        {% for option in icon_options %}
                        <option value="{{ option.value }}" data-icon="{{ option.value }}">{{ option.label }}</option>
                        {% endfor %}
                    </select>
                </label>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-link" onclick="closeGroupModal()">取消</button>
                <button type="submit" class="btn btn-primary"><i class="ph ph-floppy-disk"></i> 保存</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// ---------- 名称筛选（前端过滤） ----------
function filterGroups(keyword) {
    var needle = (keyword || '').trim().toLowerCase();
    document.querySelectorAll('#groupsTable tbody tr[data-group]').forEach(function (row) {
        var data = JSON.parse(row.dataset.group);
        row.hidden = needle !== '' && data.name.toLowerCase().indexOf(needle) === -1;
    });
}

// ---------- 图标选择（由 ui-select 统一渲染，这里只处理回显） ----------
function setGroupIcon(value) {
    var iconSelect = document.getElementById('group-icon');
    var hasOption = Array.prototype.some.call(iconSelect.options, function (option) {
        return option.value === value;
    });
    iconSelect.value = hasOption ? value : iconSelect.options[0].value;
}

// ---------- 新建 / 编辑模态框 ----------
var modalOverlay = document.getElementById('group-modal');
var modalForm = document.getElementById('group-modal-form');
var modalTitle = document.getElementById('group-modal-title');
var createActionUrl = modalForm.getAttribute('action');
var lastFocused = null;

function openGroupModal(groupJson) {
    lastFocused = document.activeElement;
    if (groupJson) {
        var group = JSON.parse(groupJson);
        modalForm.setAttribute('action', '/groups/' + group.id + '/update');
        modalTitle.textContent = '编辑分组';
        document.getElementById('group-name').value = group.name;
        document.getElementById('group-sort').value = group.sort_order;
        setGroupIcon(group.icon);
    } else {
        modalForm.setAttribute('action', createActionUrl);
        modalTitle.textContent = '新建分组';
        modalForm.reset();
        document.getElementById('group-sort').value = '10';
        setGroupIcon('{{ icon_options[0].value }}');
    }
    modalOverlay.classList.add('is-open');
    document.body.classList.add('modal-open');
    document.getElementById('group-name').focus();
}

function closeGroupModal() {
    if (window.UISelect) { UISelect.closeAll(); }
    modalOverlay.classList.remove('is-open');
    document.body.classList.remove('modal-open');
    if (lastFocused) { lastFocused.focus(); }
}

modalOverlay.addEventListener('click', function (event) {
    if (event.target === modalOverlay) { closeGroupModal(); }
});

document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && modalOverlay.classList.contains('is-open')) {
        closeGroupModal();
    }
});
</script>
{% endblock %}
